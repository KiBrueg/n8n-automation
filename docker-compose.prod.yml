# ============================================================
# AI Automation Hub — PRODUCTION stack (VPS)
# ------------------------------------------------------------
# Самодостаточный прод-файл (НЕ override). Запуск на сервере:
#   docker compose -f docker-compose.prod.yml up -d
#
# Отличия от dev (docker-compose.yml):
#   - пиннинг версий образов (нет :latest)
#   - resource-лимиты под 4 ГБ RAM
#   - healthcheck у всех сервисов
#   - ротация логов (json-file, 10m x 3)
#   - НЕТ публикации портов наружу, кроме Caddy (80/443)
#   - gateway тянется образом из GHCR (CI), с фолбэком на локальную сборку
#   - добавлен uptime-kuma (мониторинг) за Caddy
#
# ВАЖНО (пиннинг): теги ниже привязаны к мажорной версии — это разумный
# компромисс. Перед прод-релизом зафиксируй точную минорную версию
# (например n8nio/n8n:1.90.2), чтобы сборка была полностью воспроизводимой.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:

  caddy:
    image: caddy:2-alpine
    <<: *default-restart
    init: true   # tini как PID 1 — реапит зомби от healthcheck (wget каждые 30с)
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - N8N_HOST=${N8N_HOST}
      - GATEWAY_HOST=${GATEWAY_HOST}
      - STATUS_HOST=${STATUS_HOST}
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      gateway:
        condition: service_healthy
      n8n:
        condition: service_started
      uptime-kuma:
        condition: service_started
    networks: [hub]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  gateway:
    # CI собирает и пушит образ в GHCR; deploy делает `docker compose pull`.
    # build оставлен фолбэком для первого запуска без registry.
    image: ${GATEWAY_IMAGE:-ghcr.io/kibrueg/n8n-automation-gateway:latest}
    build: ./gateway
    <<: *default-restart
    init: true   # tini как PID 1 — реапит зомби от healthcheck (python каждые 15с)
    env_file: .env
    environment:
      - MODES_DIR=/app/modes
      - PROMPTS_DIR=/app/prompts
    expose:
      - "8000"
    volumes:
      - ./modes:/app/modes:ro
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hub]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M

  n8n:
    image: n8nio/n8n:1
    <<: *default-restart
    env_file: .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - GENERIC_TIMEZONE=${TZ:-Europe/Berlin}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - GATEWAY_URL=http://gateway:8000
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [hub]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1200M
        reservations:
          memory: 512M

  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./gateway/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    networks: [hub]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M
        reservations:
          memory: 512M

  uptime-kuma:
    image: louislam/uptime-kuma:1
    <<: *default-restart
    volumes:
      - kuma_data:/app/data
    expose:
      - "3001"
    networks: [hub]
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  pg_data:
  n8n_data:
  caddy_data:
  caddy_config:
  kuma_data:

networks:
  hub:
    driver: bridge
