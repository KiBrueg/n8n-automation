[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # длина строки контролируется line-length, но не валит билд

[tool.ruff.lint.flake8-bugbear]
# FastAPI: Depends/Header/Query в дефолтах аргументов — штатный приём, не баг (B008)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
