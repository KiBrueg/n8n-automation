name: Deploy

# Авто-деплой на VPS при пуше в main.
# Сначала прогоняем CI (lint+test) — деплоим только если он зелёный.
#
# Требуются GitHub Secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST        — IP сервера
#   SSH_USER        — пользователь (созданный hardening.sh)
#   SSH_PRIVATE_KEY — приватный SSH-ключ для входа
#   SSH_PORT        — порт SSH (по умолчанию 22)
#   DEPLOY_PATH     — путь к проекту на сервере, напр. /home/<user>/n8n-automation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # 1) Гейт качества — переиспользуем те же проверки, что в CI
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest pytest-asyncio
      - name: Lint
        run: ruff check .
      - name: Test
        run: PYTHONPATH=. pytest -q

  # 2) Сборка образа gateway и пуш в GHCR
  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-gateway" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Деплой на VPS по SSH
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            export GATEWAY_IMAGE="${{ needs.build-and-push.outputs.image }}:latest"
            ./deploy/deploy.sh
